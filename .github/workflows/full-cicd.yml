name: Full CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./02_GitHub_CLI_and_VSCode

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run linting
        run: flake8 . --max-line-length=100

      - name: Run tests
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    # Publish only on pushes to main, not pull requests.
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./04_Docker_Containerization
          push: true
          tags: |
            nuxudhbi/flask-demo:${{ github.sha }}
            nuxudhbi/flask-demo:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          IMAGE="docker.io/nuxudhbi/flask-demo:${GITHUB_SHA}"

          echo "Deploying image: ${IMAGE}"

          curl -fsS -X POST \
            -G "${DEPLOY_HOOK}" \
            --data-urlencode "imgURL=${IMAGE}"

  health-check:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Render deployment
        run: sleep 30

      - name: Check application health
        run: |
          URL="https://flask-demo-latest.onrender.com"

          for i in {1..10}; do
            STATUS=$(curl -s -o response.json -w "%{http_code}" "$URL")

            if [ "$STATUS" = "200" ] && grep -q "Hello from a containerized Flask app!" response.json; then
              echo "Application is healthy!"
              cat response.json
              exit 0
            fi

            echo "Attempt $i failed. HTTP status: $STATUS"
            sleep 15
          done

          echo "Health check failed!"
          exit 1